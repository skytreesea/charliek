# fly.toml app configuration file generated for charlie-k on 2026-01-13T11:02:28+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'charlie-k'
primary_region = 'nrt'
console_command = '/rails/bin/rails console'

[deploy]
  release_command = "bin/rails db:migrate"

[build]

[env]
  PORT = '8080'
  # 기사생성기(Gemini): fly secrets set GEMINI_API_KEY=키
  # Tigris 환경 변수는 fly secrets로 설정하세요:
  # fly secrets set AWS_ACCESS_KEY_ID=<your-access-key>
  # fly secrets set AWS_SECRET_ACCESS_KEY=<your-secret-key>
  # fly secrets set AWS_ENDPOINT_URL_S3=<tigris-endpoint>
  # fly secrets set BUCKET_NAME=<your-bucket-name>

[processes]
  app = '/rails/bin/rails server -b 0.0.0.0 -p 8080'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/up'
    protocol = 'http'
    tls_skip_verify = false

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/up'
    protocol = 'http'
    tls_skip_verify = false

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
